spring.application.name=Gestionale_Biblioteca
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.config.import=optional:file:./secrets.properties
# Configurazione JPA / Hibernate
# 'validate' controlla che le entity corrispondano esattamente alle tabelle esistenti senza modificarle
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8082

jwt.secret=${JWT_SECRET}